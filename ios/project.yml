name: AIWorkspace
options:
  minimumXcodeGenVersion: 2.42.0
  projectFormat: xcode16_0
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: 3
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AIWorkspace:
    type: application
    platform: iOS
    sources: [App, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kuoforever.aiworkspace.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI Workspace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
  AIWorkspaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kuoforever.aiworkspace.ios.tests
    dependencies:
      - target: AIWorkspace
    info:
      path: Tests/Info.plist
  AIWorkspaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests, ../fixtures/mobile-review.json]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kuoforever.aiworkspace.ios.uitests
    dependencies:
      - target: AIWorkspace
    info:
      path: UITests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
schemes:
  AIWorkspace:
    build:
      targets:
        AIWorkspace: all
    test:
      gatherCoverageData: true
      targets:
        - name: AIWorkspaceTests
          parallelizable: false
        - name: AIWorkspaceUITests
          parallelizable: false
